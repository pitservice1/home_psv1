<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Optimasi Khusus iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WebChat">
  <title>WebChat</title>
  
  <link rel="icon" type="image/jpeg" href="https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png"> 
  <link rel="apple-touch-icon" href="https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png">
 
  <!-- Manifest Dinamis -->
  <link id="pwa-manifest" rel="manifest" href="">

  <style>
    body {
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: #f4f7f6;
      touch-action: none; 
    }

    /* Sembunyikan Header */
    header, .sites-header, .navbar, [role="banner"],
    .sites-embed-site-header, .site-header-container {
      display: none !important;
      height: 0 !important;
      visibility: hidden !important;
      opacity: 0 !important;
      position: absolute !important;
    }
    
    iframe {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      border: none !important;
      z-index: 10 !important;
      opacity: 0; 
      transition: opacity 0.8s ease-in-out;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999 !important;
      transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
    }

    .loader-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      animation: pulse 2s infinite ease-in-out;
      margin-bottom: 30px;
      border: 4px solid #f0f0f0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    .loading-text {
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #555;
      font-size: 16px;
      font-weight: 500;
      animation: blink 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(52, 152, 219, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Tombol PWA Android */
    #install-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
      cursor: pointer;
      z-index: 1000000;
      transition: all 0.3s ease;
    }
    #install-btn:hover { background-color: #2980b9; transform: translateY(-2px); }

    /* Modal Instruksi iOS */
    #ios-install-prompt {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
      z-index: 1000000;
      font-family: 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      width: 80%;
      max-width: 320px;
    }
    #ios-install-prompt p { margin: 0 0 10px 0; font-size: 14px; color: #333; }
    #ios-install-prompt span { font-size: 20px; font-weight: bold; }
    #close-ios-prompt {
      background: #eee; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <img src="https://cdn.phototourl.com/free/2026-07-30-478ff464-9cca-4f6c-9a7d-e51450dcb75a.jpg" alt="Logo" class="loader-logo">
    <div class="spinner"></div>
    <div class="loading-text">Komunikasi setiap waktu</div>
  </div>

  <!-- IFRAME -->
  <iframe id="main-iframe" src="https://script.google.com/macros/s/AKfycbyxOwcPSpSee1J1M-TKovYvcJbnvL468zB6IOAXKGRKS1PaU_fH5tuMVAP7FdK8ayx3kQ/exec?page=Index"></iframe>

  <!-- TOMBOL INSTALL ANDROID -->
  <button id="install-btn">Install App WebChat</button>

  <!-- MODAL INSTALL IOS -->
  <div id="ios-install-prompt">
    <p>Install WebChat di iPhone Anda:</p>
    <p>Tap icon Share <span>⍐</span> di bawah, lalu pilih<br><strong>"Add to Home Screen"</strong></p>
    <button id="close-ios-prompt">Tutup</button>
  </div>

  <script>
    // 1. Loading Screen Logic
    const iframe = document.getElementById('main-iframe');
    const loadingScreen = document.getElementById('loading-screen');
    iframe.onload = () => {
      loadingScreen.style.opacity = '0';
      loadingScreen.style.visibility = 'hidden';
      iframe.style.opacity = '1';
    };
    setTimeout(() => {
      if (loadingScreen.style.opacity !== '0') {
        loadingScreen.style.opacity = '0';
        loadingScreen.style.visibility = 'hidden';
        iframe.style.opacity = '1';
      }
    }, 12000);

    // 2. Hide Google Sites UI
    setTimeout(() => {
      document.querySelectorAll('div').forEach(el => {
        const style = window.getComputedStyle(el);
        if ((style.position === 'fixed' || style.top === '0px') && 
            !['loading-screen', 'install-btn', 'ios-install-prompt'].includes(el.id)) {
          el.style.display = 'none !important';
        }
      });
    }, 1000);

    // 3. PWA Manifest
    const manifestData = {
      "name": "SAR PSV1",
      "short_name": "SAR",
      "description": "Laporan Inspeksi Sump, Boster, dan Outlet",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#ffffff",
      "icons": [
        {"src": "https://cdn.phototourl.com/free/2026-07-30-478ff464-9cca-4f6c-9a7d-e51450dcb75a.jpg", "sizes": "192x192", "type": "image/jpeg"},
        {"src": "https://cdn.phototourl.com/free/2026-07-30-478ff464-9cca-4f6c-9a7d-e51450dcb75a.jpg", "sizes": "512x512", "type": "image/jpeg"}
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
    document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

    // 4. Service Worker dengan Dukungan Notifikasi (Push)
    const swCode = `
      self.addEventListener('install', (event) => self.skipWaiting());
      self.addEventListener('activate', (event) => event.waitUntil(clients.claim()));
      
      self.addEventListener('fetch', (event) => {
        event.respondWith(fetch(event.request).catch(() => new Response('Offline.')));
      });

      // Menerima Push Notification (Background)
      self.addEventListener('push', function(event) {
        let options = {
          body: event.data ? event.data.text() : 'Pesan baru diterima!',
          icon: 'https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png',
          vibrate: [200, 100, 200],
          badge: 'https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png'
        };
        event.waitUntil(self.registration.showNotification('WebChat', options));
      });

      // Aksi saat notifikasi di-klik
      self.addEventListener('notificationclick', function(event) {
        event.notification.close();
        event.waitUntil(clients.openWindow('/'));
      });
    `;
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).then(() => {
          console.log('SW PWA Registered');
        });
      });
    }

    // 5. PWA Install Prompt (Android vs iOS)
    const isIos = () => {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

    if (isIos() && !isInStandaloneMode()) {
      // Tampilkan panduan install untuk iOS (tampil setelah 3 detik)
      setTimeout(() => {
        document.getElementById('ios-install-prompt').style.display = 'block';
      }, 3000);
      
      document.getElementById('close-ios-prompt').addEventListener('click', () => {
        document.getElementById('ios-install-prompt').style.display = 'none';
      });
    } else {
      // Android Install Prompt
      let deferredPrompt;
      const installBtn = document.getElementById('install-btn');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
          installBtn.style.display = 'none';
        }
      });
      window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
      });
    }

    // 6. Request Notification Permission
    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") console.log("Notifikasi diizinkan.");
        });
      }
    }
    
    // Minta izin notifikasi (sebaiknya dipanggil saat user berinteraksi dengan layar, misal klik body)
    document.body.addEventListener('click', () => {
      if (Notification.permission === 'default') requestNotificationPermission();
    }, { once: true });

    // 7. Bridge Komunikasi Iframe (Untuk memicu notifikasi dari Google Script)
    window.addEventListener('message', (event) => {
      // Pastikan pesan berasal dari iframe Anda (Opsional: validasi event.origin)
      if (event.data && event.data.type === 'NEW_MESSAGE') {
        if (Notification.permission === 'granted') {
          // Kirim Notifikasi Lokal (Saat aplikasi terbuka)
          navigator.serviceWorker.ready.then(function(registration) {
            registration.showNotification('Pesan Baru', {
              body: event.data.text || 'Anda menerima pesan baru',
              icon: 'https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png',
              vibrate: [200, 100, 200]
            });
          });
        }
      }
    });
  </script>
</body>
</html>
