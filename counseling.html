<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Kunci zoom dan skala agar seperti native app -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* Reset dasar untuk frame embed */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      /* Mencegah efek bounce / pull-to-refresh di mobile */
      overscroll-behavior: none !important; 
      overflow: hidden !important;
      background-color: #f4f7fb; /* Mencegah flash putih sebelum iframe load */
    }
    
    /* ATUR TAMPILAN IFRAME SEPENUH LAYAR */
    iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      /* Gunakan 100dvh agar tinggi presisi mengikuti address bar mobile */
      height: 100dvh !important; 
      border: none !important;
      z-index: 999999 !important;
      display: block !important;
    }
  </style>
</head>
<body>
  
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxMIw9bNtWvLp7mo3Qqq85YD4LpP1R-MniVxLsFGwGcj3i_yj4XCJyKSMyEIY5tiTPj/exec"
    allow="fullscreen; camera; microphone; clipboard-read; clipboard-write" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads">
  </iframe>

</body>
</html>
