<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet · Fiori Style Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', '72', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #f5f6f7;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        /* ========== HEADER SAP FIORI STYLE ========== */
        .header {
            background: #354a5f;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 10;
            position: relative;
            border-bottom: 2px solid #8fb4c7;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        /* Tombol Back & Dashboard */
        .nav-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
            color: #ffffff;
        }

        .nav-btn-text {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 16px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            transition: 0.2s;
            flex-shrink: 0;
            font-weight: 500;
        }

        .nav-btn-text:hover, .nav-btn-text.active {
            background: rgba(255,255,255,0.12);
            border-color: #8fb4c7;
            color: #ffffff;
        }

        .nav-btn-text i { font-size: 0.9rem; }
        #navBackBtn { display: none; }
        #navBackBtn.visible { display: flex; }

        /* Search Bar */
        .search-container {
            flex: 0 0 320px;
            margin: 0 16px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            outline: none;
            height: 36px;
        }

        .search-container input::placeholder { color: rgba(255,255,255,0.5); }
        .search-container input:focus {
            background: rgba(255,255,255,0.15);
            border-color: #8fb4c7;
            box-shadow: 0 0 0 3px rgba(143, 180, 199, 0.2);
        }

        .search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .search-container .search-clear {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
        }
        .search-container .search-clear:hover { color: #ffffff; }

        /* Header Right */
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #5f7d94;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        .user-avatar:hover {
            border-color: rgba(255,255,255,0.3);
            background: #6d8ba2;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-right: 8px;
        }
        .user-name { color: #ffffff; font-size: 0.8rem; font-weight: 500; }

        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            background: #f5f6f7;
            padding: 8px 24px;
            border-bottom: 1px solid #e0e4e8;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #666;
            min-height: 36px;
        }
        .breadcrumb i { font-size: 0.7rem; color: #999; }
        .breadcrumb .active { color: #354a5f; font-weight: 500; }
        .breadcrumb .separator { color: #ccc; }

        /* ========== MENU CONTAINER ========== */
        .menu-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 32px 32px 32px;
            transition: 0.3s;
            overflow-y: auto;
            background: #f5f6f7;
        }
        .menu-container.hidden { display: none; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .menu-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #354a5f;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .menu-title i { color: #8fb4c7; font-size: 1.4rem; }
        .menu-count { font-size: 0.8rem; color: #999; font-weight: 400; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        /* ========== CARD OPTIMIZATION ========== */
        .sheet-card {
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e4e8;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .sheet-card:hover {
            border-color: #8fb4c7;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 32, 64, 0.08);
        }

        /* Fokus stat untuk Aksesibilitas (a11y) */
        .sheet-card:focus {
            outline: 2px solid #8fb4c7;
            outline-offset: 2px;
        }

        .sheet-card .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #354a5f;
            color: white;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        /* Wrapper gambar agar animasi scale tidak merusak border-radius card */
        .card-img-wrapper {
            width: 100%;
            height: 120px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eaebec;
            overflow: hidden; /* Menyembunyikan gambar yang ter-zoom */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
            transition: transform 0.3s ease; /* Transisi halus untuk efek hover */
        }

        /* Efek Zoom in ringan saat card dihover */
        .sheet-card:hover .card-img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 6px;
            flex: 1;
        }

        .card-body h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #354a5f;
            margin: 0;
            line-height: 1.3;
        }

        .card-caption {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
            margin-top: 2px;
        }

        .card-footer {
            width: 100%;
            padding: 10px 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #999;
        }

        .card-footer i { color: #8fb4c7; margin-right: 4px; }

        /* ========== IFRAME CONTAINER ========== */
        .iframe-container {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #f5f6f7;
            position: relative;
        }
        .iframe-container.visible { display: flex; }
        #sheetFrame { width: 100%; flex: 1; border: none; background: white; }

        /* ========== LOADING & NOTIFICATION ========== */
        .loading, .notification { position: fixed; z-index: 400; }
        
        .loading {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.97);
            padding: 32px 48px; border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            display: none; text-align: center;
            border: 1px solid #e0e4e8; color: #354a5f;
        }
        
        .spinner {
            width: 40px; height: 40px; border: 3px solid #e0e4e8;
            border-top-color: #8fb4c7; border-radius: 50%;
            animation: spin 0.8s infinite linear; margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .notification {
            bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #354a5f; color: white; padding: 12px 24px;
            border-radius: 4px; box-shadow: 0 4px 16px rgba(53, 74, 95, 0.3);
            display: none; align-items: center; gap: 12px; z-index: 500;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .search-container { flex: 0 0 240px; }
            .user-info { display: none; }
        }

        @media (max-width: 768px) {
            .header { padding: 0 16px; height: 52px; flex-wrap: wrap; }
            .search-container { flex: 1; margin: 0 8px; }
            .search-container input { font-size: 0.8rem; height: 32px; }
            .nav-btn-text span { display: none; }
            .menu-container { padding: 16px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
        }

        @media (max-width: 480px) {
            .header { height: 48px; padding: 0 12px; }
            .search-container { margin: 0 4px; }
            .search-container input { height: 28px; }
            .menu-container { padding: 12px; }
            
            /* Menggunakan minmax agar lebih adaptif di layar HP kecil */
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            
            .card-body h3 { font-size: 0.85rem; }
            .card-caption { font-size: 0.7rem; }
            .card-footer { font-size: 0.6rem; padding: 6px 12px; }
            .card-img-wrapper { height: 90px; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-wrapper">
    
    <div class="header">
        <div class="header-left">
            <button class="nav-btn" id="navBackBtn" title="Kembali"><i class="fas fa-arrow-left"></i></button>
            <button class="nav-btn-text active" id="navDashboardBtn" title="Ke Dashboard">
                <i class="fas fa-th-large"></i><span>Home</span>
            </button>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari laporan..." />
                <span class="search-clear" id="searchClear"><i class="fas fa-times-circle"></i></span>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info"><span class="user-name">Admin</span></div>
            <div class="user-avatar" title="User Profile"><i class="fas fa-user"></i></div>
        </div>
    </div>

    <div class="breadcrumb" id="breadcrumb">
        <i class="fas fa-home"></i><span>Home</span><span class="separator"> / </span><span class="active">Dashboard Spreadsheet</span>
    </div>

    <div class="menu-container" id="menuContainer">
        <div class="menu-header">
            <div class="menu-title">
                <i class="fas fa-folder-open"></i> Laporan Tersedia <span class="menu-count" id="menuCount"></span>
            </div>
        </div>
        <div class="card-grid" id="cardContainer">
            <!-- Cards Rendered Here -->
        </div>
    </div>

    <div class="iframe-container" id="iframeContainer">
        <iframe id="sheetFrame" src="about:blank"></iframe>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div> 
    <div><strong>Memuat Spreadsheet...</strong></div>
    <div style="font-size:0.8rem; color:#999; margin-top:4px;">Mohon tunggu sebentar</div>
</div>
<div class="notification" id="notification"><i class="fas fa-check-circle"></i> <span></span></div>

<script>
    (function() {
        const sheets = {
            sheet1: { 
                id: "1Q2th3OirVj1PWRcl70fgJgmUuji03gBmP9Kvrj3ad1E", gid: "1101821162", 
                name: "Sampel TSS Kelayang", caption: "Data sampel TSS di Kelayang 1 dan 2 Per 2 hari",
                image: "https://cdn.phototourl.com/free/2026-08-11-0205864b-aa2b-454b-80ca-575007b874a6.jpg", badge: "TSS"
            },
            sheet2: { 
                id: "1_QEw0cPXGLu5xar7YJq6IuIu9Lkfb8xMLl4o0osdGe0", gid: "99887734", 
                name: "Report TSS", caption: "Report Average TSS MTD",
                image: "https://cdn.phototourl.com/free/2026-08-11-bfd954c4-b87d-4b81-8ad1-7f65137ad7bc.png", badge: "Report"
            },
            sheet3: { 
                id: "1HhUmariaHQiJ1AJU_zWcSO_-mBrJjznHzdhXGOyinwY", gid: "0", 
                name: "Level & Debit", caption: "Tinggi muka air dan debit all pond",
                image: "https://cdn.phototourl.com/free/2026-08-11-8a8d66fa-dd1c-49c9-8f63-49254d4cf9cc.png", badge: "Monitoring"
            },
            sheet4: { 
                id: "1HhUmariaHQiJ1AJU_zWcSO_-mBrJjznHzdhXGOyinwY", gid: "351995083", 
                name: "Weekly KPC", caption: "Laporan Pemakaian Chemical ke KPC Update tiap hari",
                image: "https://cdn.phototourl.com/free/2026-08-11-2e1bad52-b69a-45e6-919b-0bd9781b1c88.png", badge: "KPC"
            },
            sheet5: { 
                id: "1_QEw0cPXGLu5xar7YJq6IuIu9Lkfb8xMLl4o0osdGe0", gid: "744388565", 
                name: "TSS & PH Perjam", caption: "Data TSS & PH Perjam cukup di Report Timesheet",
                image: "https://cdn.phototourl.com/free/2026-08-11-b5b9d1ba-e545-4cbf-96b5-40165f54d913.png", badge: "Real-time"
            },
            sheet6: { 
                id: "1_QEw0cPXGLu5xar7YJq6IuIu9Lkfb8xMLl4o0osdGe0", gid: "690433105", 
                name: "Report Timesheet", caption: "Upload hasil Timesheet MWT disini",
                image: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=500&q=80", badge: "Timesheet"
            }
        };

        const menuContainer = document.getElementById('menuContainer');
        const iframeContainer = document.getElementById('iframeContainer');
        const navBackBtn = document.getElementById('navBackBtn');
        const navDashboardBtn = document.getElementById('navDashboardBtn');
        const sheetFrame = document.getElementById('sheetFrame');
        const loadingEl = document.getElementById('loading');
        const notif = document.getElementById('notification');
        const notifMsg = notif.querySelector('span');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const breadcrumb = document.getElementById('breadcrumb');
        const menuCount = document.getElementById('menuCount');

        function showNotif(msg) {
            notifMsg.innerText = msg;
            notif.style.display = 'flex';
            setTimeout(() => { notif.style.display = 'none'; }, 2800);
        }

        function updateBreadcrumb(path) {
            const parts = path.split(' / ');
            breadcrumb.innerHTML = `<i class="fas fa-home"></i><span>Home</span><span class="separator"> / </span><span class="active">${parts.join(' / ')}</span>`;
        }

        function showMenu() {
            menuContainer.classList.remove('hidden');
            iframeContainer.classList.remove('visible');
            navBackBtn.classList.remove('visible');
            navDashboardBtn.classList.add('active');
            updateBreadcrumb('Dashboard Spreadsheet');
            searchInput.value = '';
            filterCards('');
            searchClear.style.display = 'none';
        }

        function showIframe(sheetName) {
            menuContainer.classList.add('hidden');
            iframeContainer.classList.add('visible');
            navBackBtn.classList.add('visible');
            navDashboardBtn.classList.remove('active');
            updateBreadcrumb(`Dashboard Spreadsheet / ${sheetName}`);
        }

        function loadSheet(sheetKey) {
            const s = sheets[sheetKey];
            if (!s) return;
            
            loadingEl.style.display = 'block';
            sheetFrame.src = `https://docs.google.com/spreadsheets/d/${s.id}/edit?hl=id&gid=${s.gid}`;
            
            sheetFrame.onload = () => {
                loadingEl.style.display = 'none';
                showNotif(`Memuat ${s.name}`);
            };
            
            setTimeout(() => {
                if (loadingEl.style.display !== 'none') {
                    loadingEl.style.display = 'none';
                    showNotif(`Gagal memuat ${s.name}, coba refresh`);
                }
            }, 15000);
            
            showIframe(s.name);
        }

        navBackBtn.addEventListener('click', showMenu);
        navDashboardBtn.addEventListener('click', showMenu);

        // ===== SEARCH FUNCTION =====
        function filterCards(query) {
            const cards = document.querySelectorAll('.sheet-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const searchString = `${card.dataset.name} ${card.dataset.caption} ${card.dataset.badge}`.toLowerCase();
                const isMatch = searchString.includes(query.toLowerCase().trim());
                
                card.style.display = isMatch ? 'flex' : 'none';
                if (isMatch) visibleCount++;
            });
            
            menuCount.textContent = `(${visibleCount})`;
            searchClear.style.display = query.length > 0 ? 'block' : 'none';
        }

        searchInput.addEventListener('input', (e) => filterCards(e.target.value));
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            filterCards('');
            searchInput.focus();
        });

        // ===== RENDER CARDS (OPTIMIZED) =====
        function renderCards() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';
            
            Object.entries(sheets).forEach(([key, val]) => {
                const card = document.createElement('div');
                card.className = 'sheet-card';
                card.dataset.sheet = key;
                card.dataset.name = val.name;
                card.dataset.caption = val.caption;
                card.dataset.badge = val.badge || '';
                
                // Menambahkan atribut aksesibilitas
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Buka laporan ${val.name}`);
                
                // HTML render dengan lazy loading pada gambar dan wrapper untuk animasi
                card.innerHTML = `
                    <span class="card-badge">${val.badge || 'Sheet'}</span>
                    <div class="card-img-wrapper">
                        <img src="${val.image}" alt="${val.name}" class="card-img" loading="lazy" decoding="async" />
                    </div>
                    <div class="card-body">
                        <h3>${val.name}</h3>
                        <div class="card-caption">${val.caption}</div>
                    </div>
                    <div class="card-footer">
                        <span><i class="fas fa-file-excel"></i> Google Sheets</span>
                        <span><i class="fas fa-arrow-right"></i> Buka</span>
                    </div>
                `;
                
                // Click event
                card.addEventListener('click', () => loadSheet(key));
                
                // Keyboard navigasi event (Enter atau Spasi)
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        loadSheet(key);
                    }
                });

                container.appendChild(card);
            });
            
            menuCount.textContent = `(${Object.keys(sheets).length})`;
        }
        
        renderCards();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

    })();
</script>
</body>
</html>
