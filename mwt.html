<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data MWT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #172e6e;
            --primary-light: #2563eb;
            --primary-soft: #eff6ff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-muted: #94a3b8;
            --bg: #f1f5f9;
            --green: #16a34a;
            --radius: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        /* ========== HEADER BIRU KORPORAT ========== */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 52px;
            box-shadow: 0 2px 8px rgba(30, 58, 138, 0.25);
            z-index: 10;
            position: relative;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        /* Tombol Back & Home */
        .nav-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 13px;
            transition: 0.2s;
            flex-shrink: 0;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* Tombol Home (link ke home utama) */
        .nav-home {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 0 12px;
            height: 32px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            transition: 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-home:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .nav-home i { font-size: 11px; }

        #navBackBtn { display: none; }
        #navBackBtn.visible { display: flex; }

        /* Search Bar */
        .search-container {
            flex: 0 0 300px;
            margin: 0 8px;
            position: relative;
            min-width: 0;
        }

        .search-container input {
            width: 100%;
            padding: 7px 30px 7px 32px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 12px;
            transition: all 0.2s;
            outline: none;
            height: 32px;
            font-family: inherit;
        }

        .search-container input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .search-container input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .search-container i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
        }

        .search-container .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 12px;
            display: none;
        }
        .search-container .search-clear:hover { color: #fff; }

        /* Header Right */
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .user-avatar:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-right: 4px;
        }
        .user-name { color: #fff; font-size: 11px; font-weight: 600; }

        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            background: #fff;
            padding: 7px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-sub);
            min-height: 30px;
            font-weight: 500;
        }
        .breadcrumb i { font-size: 10px; color: var(--primary); }
        .breadcrumb .active { color: var(--primary); font-weight: 600; }
        .breadcrumb .separator { color: var(--text-muted); }

        /* ========== MENU CONTAINER ========== */
        .menu-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            transition: 0.3s;
            overflow-y: auto;
            background: var(--bg);
        }
        .menu-container.hidden { display: none; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
        }

        /* ========== CARD ========== */
        .sheet-card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .sheet-card:hover {
            border-color: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);
        }

        .sheet-card:focus {
            outline: 2px solid var(--primary-light);
            outline-offset: 2px;
        }

        .sheet-card .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 0.3px;
            z-index: 2;
            text-transform: uppercase;
        }

        .card-img-wrapper {
            width: 100%;
            height: 100px;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
            transition: transform 0.3s ease;
        }

        .sheet-card:hover .card-img {
            transform: scale(1.03);
        }

        .card-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 3px;
            flex: 1;
        }

        .card-body h3 {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .card-caption {
            font-size: 10px;
            color: var(--text-sub);
            line-height: 1.4;
            margin-top: 1px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            width: 100%;
            padding: 7px 12px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            color: var(--text-sub);
            background: #f8fafc;
            font-weight: 500;
        }

        .card-footer i { color: var(--primary); margin-right: 3px; font-size: 9px; }

        /* ========== IFRAME CONTAINER ========== */
        .iframe-container {
            flex: 1;
            display: none;
            flex-direction: column;
            background: var(--bg);
            position: relative;
        }
        .iframe-container.visible { display: flex; }
        #sheetFrame { width: 100%; flex: 1; border: none; background: #fff; }

        /* ========== LOADING & NOTIFICATION ========== */
        .loading, .notification { position: fixed; z-index: 400; }

        .loading {
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff;
            padding: 24px 32px; border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.2);
            display: none; text-align: center;
            border: 1px solid var(--border);
            color: var(--primary);
        }

        .spinner {
            width: 32px; height: 32px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s infinite linear; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading strong { font-size: 12px; }
        .loading .loading-sub { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

        .notification {
            bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: #fff; padding: 8px 16px;
            border-radius: var(--radius); box-shadow: 0 4px 16px rgba(30, 58, 138, 0.3);
            display: none; align-items: center; gap: 8px; z-index: 500;
            font-size: 11px; font-weight: 600;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .search-container { flex: 0 0 220px; }
            .user-info { display: none; }
        }

        @media (max-width: 768px) {
            .header { padding: 0 10px; height: 48px; gap: 6px; }
            .search-container { flex: 1; margin: 0 4px; }
            .search-container input { font-size: 11px; height: 30px; padding: 6px 26px 6px 30px; }
            .nav-home span { display: none; }
            .nav-home { padding: 0 9px; }
            .menu-container { padding: 6px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
        }

        @media (max-width: 480px) {
            .header { height: 44px; padding: 0 8px; }
            .search-container { margin: 0 2px; }
            .search-container input { height: 28px; font-size: 10px; }
            .nav-btn { width: 28px; height: 28px; font-size: 11px; }
            .nav-home { height: 28px; font-size: 10px; }
            .user-avatar { width: 28px; height: 28px; font-size: 11px; }
            .menu-container { padding: 4px; }

            .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }

            .card-body { padding: 8px 10px; }
            .card-body h3 { font-size: 11px; }
            .card-caption { font-size: 9px; }
            .card-footer { font-size: 8px; padding: 5px 10px; }
            .card-img-wrapper { height: 75px; }
            .card-badge { font-size: 8px; padding: 1px 6px; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">

    <div class="header">
        <div class="header-left">
            <!-- Tombol Back (panah saja) — hanya muncul saat dalam iframe -->
            <button class="nav-btn" id="navBackBtn" title="Kembali ke menu utama">
                <i class="fas fa-arrow-left"></i>
            </button>

            <!-- Tombol Home — link ke home utama eksternal -->
            <a href="https://pitservice1.github.io/home_psv1/" class="nav-home" id="navHomeBtn" title="Ke Halaman Utama">
                <i class="fas fa-home"></i><span>Home</span>
            </a>

            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Cari laporan..." />
                <span class="search-clear" id="searchClear"><i class="fas fa-times-circle"></i></span>
            </div>
        </div>
        <div class="header-right">
            <div class="user-info"><span class="user-name">Admin</span></div>
            <div class="user-avatar" title="User Profile"><i class="fas fa-user"></i></div>
        </div>
    </div>

    <div class="breadcrumb" id="breadcrumb">
        <i class="fas fa-home"></i><span>Home</span><span class="separator"> / </span><span class="active">Dashboard Spreadsheet</span>
    </div>

    <div class="menu-container" id="menuContainer">
        <div class="card-grid" id="cardContainer">
            <!-- Cards Rendered Here -->
        </div>
    </div>

    <div class="iframe-container" id="iframeContainer">
        <iframe id="sheetFrame" src="about:blank"></iframe>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <div><strong>Memuat Spreadsheet...</strong></div>
    <div class="loading-sub">Mohon tunggu sebentar</div>
</div>
<div class="notification" id="notification"><i class="fas fa-check-circle"></i> <span></span></div>

<script>
    (function() {
        const sheets = {
            sheet1: {
                id: "1Q2th3OirVj1PWRcl70fgJgmUuji03gBmP9Kvrj3ad1E", gid: "1101821162",
                name: "Sampel TSS Kelayang", caption: "Data sampel TSS di Kelayang 1 dan 2 Per 2 hari",
                image: "https://drive.google.com/thumbnail?id=1cPvah2VUFZ0FhXBI5NloUEJoQ0EzWojy&sz=w300", badge: "TSS"
            },
            sheet2: {
                id: "1_QEw0cPXGLu5xar7YJq6IuIu9Lkfb8xMLl4o0osdGe0", gid: "99887734",
                name: "Report TSS", caption: "Report Average TSS MTD",
                image: "https://drive.google.com/thumbnail?id=14TaWDke71qRXuZ-9tQCGnCjA3Ny7dmoi&sz=w300", badge: "Report"
            },
            sheet3: {
                id: "1HhUmariaHQiJ1AJU_zWcSO_-mBrJjznHzdhXGOyinwY", gid: "0",
                name: "Level & Debit", caption: "Tinggi muka air dan debit all pond",
                image: "https://drive.google.com/thumbnail?id=1CNWZFWOw3AC_HT-F6M1ZlwCCnT1gqcZp&sz=w300", badge: "Auto Fill"
            },
            sheet4: {
                id: "1HhUmariaHQiJ1AJU_zWcSO_-mBrJjznHzdhXGOyinwY", gid: "351995083",
                name: "Weekly KPC", caption: "Laporan Pemakaian Chemical ke KPC Update tiap hari",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpQRqsw6yScmUJrFAXf-bspupvRHL9qKzp9rtJJO-NgFu8dWbxISFb5RTH&s=10", badge: "KPC"
            },
            sheet5: {
                id: "1_QEw0cPXGLu5xar7YJq6IuIu9Lkfb8xMLl4o0osdGe0", gid: "744388565",
                name: "TSS & PH Perjam", caption: "Data TSS & PH Perjam cukup di Report Timesheet",
                image: "https://drive.google.com/thumbnail?id=12x4qV6a5qUimFXiLAhqRn16t6dH2E5yZ&sz=w300", badge: "Real-time"
            },
            sheet6: {
                id: "1_QEw0cPXGLu5xar7YJq6IuIu9Lkfb8xMLl4o0osdGe0", gid: "690433105",
                name: "Report Timesheet", caption: "Upload hasil Timesheet MWT disini",
                image: "https://drive.google.com/thumbnail?id=14TaWDke71qRXuZ-9tQCGnCjA3Ny7dmoi&sz=w300", badge: "Timesheet"
            },
            sheet7: {
                id: "10d3FSPdfXU3CigewvKi3srGO2Gw8DPREHk6Uxli-aGA", gid: "1547539972",
                name: "Laporan UA MWT", caption: "Dashboard UA MWT",
                image: "https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png", badge: "Report"
            },
            sheet8: {
                url: "https://pitservice1.github.io/e-mwt/", isExternal: true,
                name: "Menu E-MWT", caption: "Aplikasi E-MWT Pit Service 1",
                image: "https://cdn.phototourl.com/free/2026-08-13-d76861c3-caa6-4b2c-b9aa-526379a6b839.png", badge: "Web App"
            }
        };

        const menuContainer = document.getElementById('menuContainer');
        const iframeContainer = document.getElementById('iframeContainer');
        const navBackBtn = document.getElementById('navBackBtn');
        const sheetFrame = document.getElementById('sheetFrame');
        const loadingEl = document.getElementById('loading');
        const notif = document.getElementById('notification');
        const notifMsg = notif.querySelector('span');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        const breadcrumb = document.getElementById('breadcrumb');

        function showNotif(msg) {
            notifMsg.innerText = msg;
            notif.style.display = 'flex';
            setTimeout(() => { notif.style.display = 'none'; }, 2800);
        }

        function updateBreadcrumb(path) {
            const parts = path.split(' / ');
            breadcrumb.innerHTML = `<i class="fas fa-home"></i><span>Home</span><span class="separator"> / </span><span class="active">${parts.join(' / ')}</span>`;
        }

        // Kembali ke menu utama (dashboard spreadsheet)
        function showMenu() {
            menuContainer.classList.remove('hidden');
            iframeContainer.classList.remove('visible');
            navBackBtn.classList.remove('visible');
            updateBreadcrumb('Dashboard Spreadsheet');
            searchInput.value = '';
            filterCards('');
            searchClear.style.display = 'none';
        }

        function showIframe(sheetName) {
            menuContainer.classList.add('hidden');
            iframeContainer.classList.add('visible');
            navBackBtn.classList.add('visible');
            updateBreadcrumb(`Dashboard Spreadsheet / ${sheetName}`);
        }

        function loadSheet(sheetKey) {
            const s = sheets[sheetKey];
            if (!s) return;

            if (s.isExternal && s.url) {
                window.open(s.url, '_blank');
                return;
            }

            loadingEl.style.display = 'block';
            sheetFrame.src = `https://docs.google.com/spreadsheets/d/${s.id}/edit?hl=id&gid=${s.gid}`;

            sheetFrame.onload = () => {
                loadingEl.style.display = 'none';
                showNotif(`Memuat ${s.name}`);
            };

            setTimeout(() => {
                if (loadingEl.style.display !== 'none') {
                    loadingEl.style.display = 'none';
                    showNotif(`Gagal memuat ${s.name}, coba refresh`);
                }
            }, 15000);

            showIframe(s.name);
        }

        navBackBtn.addEventListener('click', showMenu);

        // ===== SEARCH FUNCTION =====
        function filterCards(query) {
            const cards = document.querySelectorAll('.sheet-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const searchString = `${card.dataset.name} ${card.dataset.caption} ${card.dataset.badge}`.toLowerCase();
                const isMatch = searchString.includes(query.toLowerCase().trim());

                card.style.display = isMatch ? 'flex' : 'none';
                if (isMatch) visibleCount++;
            });

            searchClear.style.display = query.length > 0 ? 'block' : 'none';
        }

        searchInput.addEventListener('input', (e) => filterCards(e.target.value));
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            filterCards('');
            searchInput.focus();
        });

        // ===== RENDER CARDS =====
        function renderCards() {
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            Object.entries(sheets).forEach(([key, val]) => {
                const card = document.createElement('div');
                card.className = 'sheet-card';
                card.dataset.sheet = key;
                card.dataset.name = val.name;
                card.dataset.caption = val.caption;
                card.dataset.badge = val.badge || '';

                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', `Buka laporan ${val.name}`);

                card.innerHTML = `
                    <span class="card-badge">${val.badge || 'Sheet'}</span>
                    <div class="card-img-wrapper">
                        <img src="${val.image}" alt="${val.name}" class="card-img" loading="lazy" decoding="async" />
                    </div>
                    <div class="card-body">
                        <h3>${val.name}</h3>
                        <div class="card-caption">${val.caption}</div>
                    </div>
                    <div class="card-footer">
                        <span><i class="fas fa-file-excel"></i> Google Sheets</span>
                        <span><i class="fas fa-arrow-right"></i> Buka</span>
                    </div>
                `;

                card.addEventListener('click', () => loadSheet(key));

                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        loadSheet(key);
                    }
                });

                container.appendChild(card);
            });
        }

        renderCards();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
        });

    })();
</script>
</body>
</html>
