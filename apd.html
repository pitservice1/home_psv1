<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APD Pit Service 1 — SAP Fiori Launchpad</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #1e3a8a;
        --primary-dark: #172e6e;
        --primary-light: #2563eb;
        --primary-soft: #eff6ff;
        --border: #e2e8f0;
        --text-main: #0f172a;
        --text-sub: #475569;
        --text-muted: #94a3b8;
        --bg: #f1f5f9;
        --radius: 4px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    html, body {
        height: 100vh;
        overflow: hidden;
        background-color: var(--bg);
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER (SATU-SATUNYA) ===== */
    .app-header {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        color: #fff;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(30, 58, 138, 0.25);
        flex-shrink: 0;
        z-index: 1000;
        gap: 10px;
        min-height: 52px;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
    }

    .icon-btn {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        width: 34px;
        height: 34px;
        border-radius: var(--radius);
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        text-decoration: none;
    }

    .icon-btn:hover {
        background: rgba(255, 255, 255, 0.28);
    }

    .icon-btn.hidden { display: none; }

    .header-brand-block {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }

    .header-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: uppercase;
        color: #fff;
    }

    .user-chip {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        flex-shrink: 0;
        padding: 6px 12px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        font-weight: 500;
    }

    /* ===== MAIN ===== */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        padding: 12px;
        min-height: 0;
        overflow: hidden;
    }

    /* ===== LAUNCHER / GRID MENU ===== */
    .launcher {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        gap: 12px;
        min-height: 0;
    }

    .launcher.hidden { display: none; }

    .menu-section {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        overflow: hidden;
        flex-shrink: 0;
    }

    /* Grid standar launchpad */
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 12px;
        padding: 14px;
    }

    .menu-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-main);
        transition: all 0.2s;
        min-width: 0;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        width: 100%;
        min-height: 80px;
    }

    .menu-card:hover {
        border-color: var(--primary-light);
        background: var(--primary-soft);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.1);
    }

    .menu-card:active { transform: translateY(0); }

    .menu-card-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
        border: 1px solid;
    }

    .menu-card:nth-child(1) .menu-card-icon { background: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
    .menu-card:nth-child(2) .menu-card-icon { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
    .menu-card:nth-child(3) .menu-card-icon { background: #fef3c7; color: #b45309; border-color: #fde68a; }
    .menu-card:nth-child(4) .menu-card-icon { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }

    .menu-card-body {
        min-width: 0;
        flex: 1;
        overflow: hidden;
    }

    .menu-card-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .menu-card-desc {
        font-size: 11px;
        color: var(--text-sub);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ===== EMBED / IFRAME VIEW ===== */
    .embed-view {
        flex: 1;
        display: none;
        flex-direction: column;
        min-height: 0;
        position: relative;
    }

    .embed-view.active { display: flex; }

    .embed-frame-wrapper {
        flex: 1;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }

    .embed-frame-wrapper iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
        background: #fff;
    }

    /* ===== LOADING ===== */
    .embed-loading {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.92);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        z-index: 5;
        font-size: 12px;
        color: var(--text-sub);
        transition: opacity 0.2s;
        border-radius: var(--radius);
    }

    .embed-loading.hidden { display: none; }

    .spinner {
        width: 34px;
        height: 34px;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== FOOTER ===== */
    footer {
        text-align: center;
        padding: 8px;
        font-size: 10px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        background: #fff;
        flex-shrink: 0;
        font-weight: 500;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
        .app-header { padding: 6px 12px; gap: 8px; min-height: 46px; }
        .user-chip { display: none; }
        .header-title { font-size: 11px; }

        .main { padding: 8px; }

        .menu-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            padding: 10px;
        }

        .menu-card { padding: 12px; gap: 10px; min-height: 70px; }
        .menu-card-icon { width: 40px; height: 40px; font-size: 16px; }
        .menu-card-title { font-size: 12px; }
        .menu-card-desc { font-size: 10px; }
    }

    @media (max-width: 480px) {
        .app-header { padding: 5px 10px; gap: 6px; }
        .icon-btn { width: 30px; height: 30px; font-size: 12px; }
        .header-title { font-size: 10px; }

        .main { padding: 6px; }

        .menu-grid {
            grid-template-columns: 1fr;
            gap: 6px;
            padding: 8px;
        }

        .menu-card {
            padding: 10px 12px;
            gap: 10px;
            min-height: 64px;
        }

        .menu-card-icon { width: 36px; height: 36px; font-size: 14px; }
        .menu-card-title { font-size: 12px; }
        .menu-card-desc { font-size: 10px; }

        footer { font-size: 9px; padding: 6px; }
    }
</style>
</head>
<body>

<!-- ===== HEADER (SATU-SATUNYA) ===== -->
<header class="app-header">
    <div class="header-left">
        <!-- Home (link eksternal) -->
        <a href="https://pitservice1.github.io/home_psv1/" class="icon-btn" title="Home Utama">
            <i class="fas fa-home"></i>
        </a>

        <!-- Back (muncul saat embed) -->
        <button class="icon-btn hidden" id="backBtn" onclick="closeEmbed()" title="Kembali ke Menu">
            <i class="fas fa-arrow-left"></i>
        </button>

        <!-- Judul dinamis (tanpa icon helm) -->
        <div class="header-brand-block">
            <div class="header-title" id="headerTitle">
                APD Management
            </div>
        </div>
    </div>
    <div class="user-chip">
        <i class="fas fa-user-circle"></i> Pit Service Air
    </div>
</header>

<!-- ===== MAIN ===== -->
<div class="main">

    <!-- LAUNCHER (GRID MENU, tanpa header "Menu Utama") -->
    <div class="launcher" id="launcher">
        <section class="menu-section">
            <div class="menu-grid">
                <button class="menu-card" onclick="openEmbed('Input Transaksi','https://script.google.com/macros/s/AKfycbww3SmtXHkE_BWMOsyh8nLFnmtxJKvZEhPzRszHRbdEV0wnn8UQJAygeJJ4Wil43-NUpw/exec','iframe')">
                    <div class="menu-card-icon"><i class="fas fa-file-signature"></i></div>
                    <div class="menu-card-body">
                        <div class="menu-card-title">Input Transaksi</div>
                        <div class="menu-card-desc">Form input APD masuk/keluar</div>
                    </div>
                </button>

                <button class="menu-card" onclick="openEmbed('Pengajuan APD','https://docs.google.com/forms/d/e/1FAIpQLSemUtp5oVI1_8QkzURXLWGTijMzSajyE2MqxvLgvU_NDJRX4Q/viewform','iframe')">
                    <div class="menu-card-icon"><i class="fas fa-box-open"></i></div>
                    <div class="menu-card-body">
                        <div class="menu-card-title">Pengajuan APD</div>
                        <div class="menu-card-desc">Form pengajuan barang APD</div>
                    </div>
                </button>

                <button class="menu-card" onclick="openEmbed('Tanda Terima','https://forms.gle/3idP5X7tS4r9jJHX9','blank')">
                    <div class="menu-card-icon"><i class="fas fa-handshake"></i></div>
                    <div class="menu-card-body">
                        <div class="menu-card-title">Tanda Terima</div>
                        <div class="menu-card-desc">Konfirmasi penerimaan APD</div>
                    </div>
                </button>

                <button class="menu-card" onclick="openEmbed('Database','https://docs.google.com/spreadsheets/d/1v5Xyj00qmj4pzCGoyRPydwLjDfu57nMBcOWtTognoyg/edit?gid=1245499998#gid=1245499998','iframe')">
                    <div class="menu-card-icon"><i class="fas fa-database"></i></div>
                    <div class="menu-card-body">
                        <div class="menu-card-title">Database</div>
                        <div class="menu-card-desc">Monitoring stok & riwayat APD</div>
                    </div>
                </button>
            </div>
        </section>
    </div>

    <!-- EMBED VIEW (FULL) -->
    <div class="embed-view" id="embedView">
        <div class="embed-frame-wrapper">
            <iframe id="embedFrame" src="about:blank" title="Workspace"></iframe>
        </div>
        <div class="embed-loading hidden" id="embedLoading">
            <div class="spinner"></div>
            <div id="embedLoadingText">Memuat...</div>
        </div>
    </div>

</div>

<footer>
    © 2026 Pit Service Air — Enterprise Systems
</footer>

<script>
    const launcher = document.getElementById('launcher');
    const embedView = document.getElementById('embedView');
    const embedFrame = document.getElementById('embedFrame');
    const embedLoading = document.getElementById('embedLoading');
    const embedLoadingText = document.getElementById('embedLoadingText');
    const backBtn = document.getElementById('backBtn');
    const headerTitle = document.getElementById('headerTitle');

    let loadingTimeout = null;

    function openEmbed(title, url, mode) {
        // Mode "blank" = buka tab baru, tidak embed
        if (mode === 'blank') {
            window.open(url, '_blank', 'noopener,noreferrer');
            return;
        }

        // Tampilkan embed view full
        launcher.classList.add('hidden');
        embedView.classList.add('active');

        // Header: tampil back + ubah judul
        backBtn.classList.remove('hidden');
        headerTitle.textContent = title;

        // Loading state
        embedLoading.classList.remove('hidden');
        embedLoadingText.textContent = `Memuat ${title}...`;
        embedFrame.src = 'about:blank';

        // Load iframe
        embedFrame.onload = () => {
            clearTimeout(loadingTimeout);
            embedLoading.classList.add('hidden');
        };
        embedFrame.onerror = () => {
            clearTimeout(loadingTimeout);
            embedLoadingText.textContent = 'Gagal memuat halaman. Coba kembali.';
        };

        embedFrame.src = url;

        // Fallback timeout
        clearTimeout(loadingTimeout);
        loadingTimeout = setTimeout(() => {
            if (!embedLoading.classList.contains('hidden')) {
                embedLoading.classList.add('hidden');
            }
        }, 12000);
    }

    function closeEmbed() {
        // Kembali ke launcher
        embedView.classList.remove('active');
        launcher.classList.remove('hidden');
        embedFrame.src = 'about:blank';

        // Header: sembunyikan back + kembalikan judul default
        backBtn.classList.add('hidden');
        headerTitle.textContent = 'APD Management';
    }
</script>

</body>
</html>
